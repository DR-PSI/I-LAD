<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TiCC · Office 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C2B3A; --ink-2:#506173; --card:rgba(255,255,255,.9); --line:rgba(28,43,58,.12);
  --brand:#1F5FB0; --solar:#F5A300; --grid:#1E7BFF; --export:#E5252A; --ok:#0FB866; --load:#A63DF0; --warn:#E5480E;
  --sans:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
:root[data-sky="night"]{ --ink:#E8EEF6; --ink-2:#A3B2C4; --card:rgba(16,24,38,.82); --line:rgba(232,238,246,.16); --brand:#7DB3FF; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#E8EEF6; --ink-2:#A3B2C4; --card:rgba(16,24,38,.82); --line:rgba(232,238,246,.16); --brand:#7DB3FF; } }
:root[data-theme="dark"]{ --ink:#E8EEF6; --ink-2:#A3B2C4; --card:rgba(16,24,38,.82); --line:rgba(232,238,246,.16); --brand:#7DB3FF; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ height:100%; margin:0; }
body{ background:#8EC3F2; color:var(--ink); font-family:var(--sans); overflow:hidden; }
#stage{ position:fixed; inset:0; }
#stage canvas{ display:block; outline:none; }

#tags{ position:fixed; inset:0; pointer-events:none; }
.tag{ position:absolute; left:0; top:0; pointer-events:auto; cursor:pointer; background:var(--card); border:1px solid var(--line);
  border-left:4px solid var(--c); border-radius:6px; padding:5px 10px 6px; white-space:nowrap; font-size:12px; line-height:1.25;
  color:var(--ink); box-shadow:0 4px 14px rgba(10,25,45,.18); backdrop-filter:blur(6px); transition:opacity .4s; }
.tag b{ display:block; font-weight:600; }
.tag span{ font-family:var(--mono); font-size:13px; font-weight:600; color:var(--c); }
.tag:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
.tag.hidden{ display:none; }
body.intro .tag, body.intro #balance{ opacity:0; }

header{ position:fixed; top:calc(env(safe-area-inset-top,0px) + 16px); left:20px; right:20px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; pointer-events:none; }
.brand{ pointer-events:auto; text-shadow:0 1px 8px rgba(255,255,255,.35); }
:root[data-sky="night"] .brand{ text-shadow:none; }
.brand h1{ margin:0; font-size:26px; letter-spacing:.06em; font-weight:600; color:var(--brand); }
.brand p{ margin:2px 0 0; font-size:14px; color:var(--ink); opacity:.8; }
.status{ margin-top:8px; display:inline-flex; align-items:center; gap:8px; font-size:13px; padding:4px 10px; border-radius:999px; background:var(--card); border:1px solid var(--line); }
.status i{ width:8px; height:8px; border-radius:50%; background:#999; }
.status.live i{ background:var(--ok); box-shadow:0 0 0 3px rgba(15,184,102,.25); }
.status.stale i{ background:var(--warn); }
.status.demo i{ background:var(--solar); }
.tools{ display:flex; gap:8px; pointer-events:auto; flex-wrap:wrap; justify-content:flex-end; }
.tools button{ font:500 13px var(--sans); color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; white-space:nowrap; backdrop-filter:blur(6px); }
.tools button[aria-pressed="true"]{ border-color:var(--brand); color:var(--brand); }
.tools button:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }

#balance{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  width:min(860px, calc(100% - 24px)); background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px 18px 12px; backdrop-filter:blur(10px); box-shadow:0 10px 30px rgba(10,25,45,.2); transition:opacity .8s; }
.eq{ display:grid; grid-template-columns:1fr auto 1fr auto 1fr; align-items:center; gap:6px 14px; }
.term .k{ font-size:13px; color:var(--ink-2); display:flex; align-items:center; gap:6px; }
.term .k::before{ content:""; width:10px; height:10px; border-radius:2px; background:var(--c); }
.term .v{ font-family:var(--mono); font-weight:600; font-size:clamp(22px,3.4vw,34px); color:var(--c); line-height:1.1; }
.term .v small{ font-size:.5em; margin-left:4px; color:var(--ink-2); }
.term .n{ font-size:12px; color:var(--ink-2); min-height:1.3em; }
.op{ font-family:var(--mono); font-size:28px; color:var(--ink-2); }
.facts{ display:flex; flex-wrap:wrap; gap:6px 22px; margin-top:10px; padding-top:9px; border-top:1px solid var(--line); font-size:13px; color:var(--ink-2); }
.facts span b{ font-family:var(--mono); color:var(--ink); font-weight:600; margin-left:4px; }
.note{ margin-top:6px; font-size:11.5px; color:var(--ink-2); }

@media (max-width:640px){
  header{ left:12px; right:12px; }
  .brand h1{ font-size:21px; }
  .tools button{ padding:6px 9px; font-size:12px; }
  .eq{ grid-template-columns:1fr auto 1fr; }
  .eq .op.eqsign{ display:none; }
  .eq .term.load{ grid-column:1 / -1; border-top:1px dashed var(--line); padding-top:6px; }
  .tag{ font-size:11px; padding:4px 8px; }
  .facts{ gap:4px 14px; font-size:12px; }
  .note{ display:none; }
}
@media (prefers-reduced-motion: reduce){ .tag, #balance{ transition:none; } }
</style>
</head>
<body class="intro">
<div id="stage" aria-label="แบบจำลอง 3 มิติของอาคารสำนักงานและระบบโซลาร์"></div>
<div id="tags"></div>

<header>
  <div class="brand">
    <h1>TiCC</h1>
    <p>อาคารสำนักงาน Tinamics</p>
    <div class="status demo" id="status"><i></i><span id="statusText">กำลังเชื่อมต่อ…</span></div>
  </div>
  <div class="tools">
    <button id="btnSky" type="button">บรรยากาศตามเวลาจริง</button>
    <button id="btnHome" type="button">มุมภาพรวม</button>
    <button id="btnSpin" type="button" aria-pressed="true">หมุนอัตโนมัติ</button>
  </div>
</header>

<section id="balance" aria-live="polite">
  <div class="eq">
    <div class="term" style="--c:var(--solar)">
      <div class="k">โซลาร์ 10 kW</div>
      <div class="v"><span id="vSolar">–</span><small>kW</small></div>
      <div class="n" id="nSolar"></div>
    </div>
    <div class="op">+</div>
    <div class="term" id="tGrid" style="--c:var(--grid)">
      <div class="k">การไฟฟ้า (IE-01)</div>
      <div class="v"><span id="vGrid">–</span><small>kW</small></div>
      <div class="n" id="nGrid"></div>
    </div>
    <div class="op eqsign">=</div>
    <div class="term load" style="--c:var(--load)">
      <div class="k">โหลดอาคาร</div>
      <div class="v"><span id="vLoad">–</span><small>kW</small></div>
      <div class="n" id="nLoad"></div>
    </div>
  </div>
  <div class="facts">
    <span>แรงดัน L-N<b id="fV">–</b></span>
    <span>กระแสเฉลี่ย<b id="fI">–</b></span>
    <span>PF<b id="fPF">–</b></span>
    <span>พลังงานสะสม<b id="fKwh">–</b></span>
    <span>อุณหภูมิตู้<b id="fT">–</b></span>
  </div>
  <div class="note">คำนวณโดยถือว่า IE-01 ติดที่จุดรับไฟการไฟฟ้า ค่าบวกคือซื้อเข้า ค่าลบคือขายคืน</div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
/* ======================= แก้ตรงนี้ ======================= */
const CONFIG = {
  project:  'motoreye-b8829',
  apiKey:   'AIzaSyA9duN7uzwd8LHZuhFj5LBcKSx5k06C-a8',
  meterDoc: 'plants/ABC/rooms/IE-01',   // มิเตอร์จุดรับไฟ (PAC 3100)
  solarDoc: null,                       // ใส่ path เมื่อต่อ inverter แล้ว เช่น 'plants/ABC/rooms/PV-01'
  solarField: 'p_total',                // ฟิลด์กำลังผลิต (W) ใน solarDoc
  solarKwp: 10,
  pollSec: 30,
  staleMin: 10
};
/* ========================================================= */

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const narrow = innerWidth < 640;
const stage = document.getElementById('stage');
const lin = hex => new THREE.Color(hex).convertSRGBToLinear();

/* ================= เรนเดอร์ ================= */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 900);
const HOME = narrow
  ? { pos:new THREE.Vector3(30, 44, 70), target:new THREE.Vector3(-5, 0, 4) }
  : { pos:new THREE.Vector3(34, 24, 44), target:new THREE.Vector3(-3, 3, 3) };
const INTRO = new THREE.Vector3(95, 75, 150);
camera.position.copy(reduceMotion ? HOME.pos : INTRO);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.copy(reduceMotion ? HOME.target : new THREE.Vector3(0, 0, 0));
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 8;
controls.maxDistance = 130;
controls.autoRotateSpeed = 0.35;

// แสงสะท้อนบนกระจกและแผงโซลาร์
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

// โพสต์โปรเซส: แสงเรืองของเส้นพลังงาน ไฟถนน ดวงอาทิตย์
const rt = renderer.capabilities.isWebGL2
  ? new THREE.WebGLMultisampleRenderTarget(1, 1, { format:THREE.RGBAFormat, encoding:THREE.LinearEncoding })
  : undefined;
const composer = new THREE.EffectComposer(renderer, rt);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), 0.75, 0.55, 0.92);
composer.addPass(bloom);
composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));

/* ================= ท้องฟ้า ================= */
const skyMat = new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{ top:{value:new THREE.Color()}, horizon:{value:new THREE.Color()}, sunDir:{value:new THREE.Vector3(0,1,0)},
             sunColor:{value:new THREE.Color()}, sunVis:{value:1} },
  vertexShader:`varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform vec3 top,horizon,sunColor; uniform vec3 sunDir; uniform float sunVis; varying vec3 vD;
    void main(){ vec3 d=normalize(vD); float h=max(d.y,0.0);
      vec3 c=mix(horizon,top,pow(h,0.5));
      float s=max(dot(d,normalize(sunDir)),0.0);
      c+=sunColor*(pow(s,1400.0)*30.0+pow(s,40.0)*0.6+pow(s,6.0)*0.18)*sunVis;
      gl_FragColor=vec4(c,1.0); }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), skyMat);
scene.add(sky);

const starGeo = new THREE.BufferGeometry();
{ const p=[]; for(let i=0;i<900;i++){ const u=Math.random(), v=Math.random()*0.9+0.08, th=u*Math.PI*2, ph=Math.acos(v);
    p.push(480*Math.sin(ph)*Math.cos(th), 480*Math.cos(ph), 480*Math.sin(ph)*Math.sin(th)); }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(p,3)); }
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0xffffff, size:1.6, sizeAttenuation:false, transparent:true, opacity:0, fog:false, toneMapped:false }));
scene.add(stars);

// เมฆ
const cloudMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:1, transparent:true, opacity:0.92, envMapIntensity:0.3 });
const clouds = new THREE.Group(); scene.add(clouds);
for (let i=0;i<9;i++){
  const c = new THREE.Group(), n = 3 + (i%3);
  for (let k=0;k<n;k++){ const s = new THREE.Mesh(new THREE.IcosahedronGeometry(3 + Math.random()*2.5, 1), cloudMat);
    s.position.set(k*3.4 - n*1.6, Math.random()*1.5, Math.random()*2.5); s.scale.y = 0.6; c.add(s); }
  const a = i/9*Math.PI*2; c.position.set(Math.cos(a)*(110+i*9), 46+(i%4)*7, Math.sin(a)*(110+i*9)); c.rotation.y = -a;
  clouds.add(c);
}

scene.fog = new THREE.Fog(0xffffff, 120, 330);

/* ================= แสง ================= */
const hemi = new THREE.HemisphereLight(0xffffff, 0xffffff, 1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-42, right:42, top:42, bottom:-42, near:1, far:200 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

/* ================= วัสดุ ================= */
const M = (hex, o={}) => { const m = new THREE.MeshStandardMaterial(Object.assign({ roughness:0.8, metalness:0.02, envMapIntensity:0.3 }, o)); m.color.copy(lin(hex)); if (o.emissive!=null) m.emissive.copy(lin(o.emissive)); return m; };
const mat = {
  ground:M(0x6CBF46,{roughness:1, envMapIntensity:0.2}), road:M(0x3F4752,{roughness:0.92}), side:M(0xD8D4CC), plaza:M(0xC9C4BA,{roughness:0.95}),
  concrete:M(0xF4EFE5), trim:M(0xCDD5DE), wall:M(0xDDE4EB,{metalness:0.2, roughness:0.5}),
  roof:M(0x3B4859,{metalness:0.45, roughness:0.42, envMapIntensity:0.4}), rib:M(0x5A6B82,{metalness:0.6, roughness:0.32}), roofSlab:M(0x55606C,{roughness:0.85}),
  glass:M(0x5AA9E6,{transparent:true, opacity:0.5, roughness:0.05, metalness:0.6, envMapIntensity:0.8}),
  windowGlow:M(0x2A3A4A,{emissive:0xFFC27A, emissiveIntensity:0}),
  frame:M(0x2A333E,{metalness:0.4, roughness:0.4}), door:M(0xC2CBD4,{metalness:0.4, roughness:0.4}),
  panel:M(0x102B6E,{roughness:0.45, metalness:0.25, envMapIntensity:0.45, emissive:0x2C6BFF, emissiveIntensity:0}),
  cell:M(0x2A4C9C,{roughness:0.6}), panelFrame:M(0xC9D0D8,{metalness:0.8, roughness:0.3}),
  white:M(0xFFFFFF), cabinet:M(0x9AA6B2,{metalness:0.45, roughness:0.45}), screen:M(0x12301C,{emissive:0x46FF86, emissiveIntensity:1.2}),
  pole:M(0xB8B5AC), leaf:M(0x3FA845,{roughness:0.75}), leaf2:M(0x8CCB3D,{roughness:0.75}), hedge:M(0x2F8F3A,{roughness:0.9}),
  trunk:M(0x8A5A33), accent:M(0xF07A1A,{emissive:0xF07A1A, emissiveIntensity:0.15}), stripe:M(0xFFFFFF,{roughness:0.6}),
  bulb:M(0xFFF1C9,{emissive:0xFFD98A, emissiveIntensity:0}), tyre:M(0x22262B,{roughness:0.7}),
  carRed:M(0xD7263D,{metalness:0.6, roughness:0.28, envMapIntensity:0.6}), carWhite:M(0xF2F4F6,{metalness:0.5, roughness:0.3, envMapIntensity:0.6}),
  carBlue:M(0x2E6FD8,{metalness:0.6, roughness:0.28, envMapIntensity:0.6}), carGlass:M(0x1C2733,{metalness:0.8, roughness:0.1, envMapIntensity:0.8})
};

function box(w,h,d,m,x,y,z,parent=scene,shadow=true){
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
  mesh.position.set(x,y,z); mesh.castShadow = shadow; mesh.receiveShadow = true;
  parent.add(mesh); return mesh;
}
const cyl = (rt,rb,h,m,x,y,z,seg=12,parent=scene) => { const c = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), m); c.position.set(x,y,z); c.castShadow = c.receiveShadow = true; parent.add(c); return c; };

/* ================= พื้น ถนน ทางเท้า ================= */
const ground = new THREE.Mesh(new THREE.CircleGeometry(340, 64), mat.ground);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
box(400, 0.05, 9, mat.road, 0, 0.03, 19, scene, false);
for (let i=-20;i<=20;i++) box(3, 0.02, 0.22, mat.stripe, i*9, 0.07, 19, scene, false);
box(400, 0.25, 2, mat.side, 0, 0.12, 13.6, scene, false);       // ทางเท้า
box(14, 0.06, 6.6, mat.road, -10, 0.04, 10.5, scene, false);    // ลานหน้าโกดัง
box(17, 0.06, 6.4, mat.plaza, 7, 0.05, 9.6, scene, false);      // ลานจอดรถหน้าออฟฟิศ
for (let i=0;i<7;i++){ const x = -0.6 + i*2.6; if (Math.abs(x-9) > 1.2) box(0.12, 0.02, 4.4, mat.stripe, x, 0.09, 10.4, scene, false); }

/* ================= อาคารสำนักงาน ================= */
const OX = 7;
box(18, 8, 12, mat.concrete, OX, 4, 0);
box(18.4, 0.6, 12.4, mat.trim, OX, 8.3, 0);
box(18.5, 0.18, 0.1, mat.accent, OX, 8.55, 6.22);
box(17.4, 0.12, 11.4, mat.roofSlab, OX, 8.62, 0);
for (let f=0; f<2; f++){
  const y = 1.9 + f*4;
  box(15.4, 2.8, 0.1, mat.windowGlow, OX+0.8, y, 5.92, scene, false);   // ไฟในห้อง (กลางคืน)
  box(15.5, 3.0, 0.12, mat.glass, OX+0.8, y, 6.06, scene, false);
  for (let i=0; i<=6; i++) box(0.12, 3.0, 0.25, mat.frame, OX-6.95+i*2.58, y, 6.1);
  box(18.2, 0.35, 0.5, mat.trim, OX, y+1.7, 6.15);
}
// หน้าต่างผนังข้างและหลัง
for (let f=0; f<2; f++) for (let k=0;k<3;k++){
  const y = 1.9 + f*4;
  box(0.1, 1.8, 2.4, mat.windowGlow, -2.03, y, -3.6+k*3.6, scene, false);
  box(0.12, 1.9, 2.5, mat.glass, -2.06, y, -3.6+k*3.6, scene, false);
  box(0.1, 1.8, 2.4, mat.windowGlow, 16.03, y, -3.6+k*3.6, scene, false);
  box(0.12, 1.9, 2.5, mat.glass, 16.06, y, -3.6+k*3.6, scene, false);
}
box(16, 0.25, 2.2, mat.trim, OX+0.5, 4.05, 7.1);
box(16, 1.0, 0.06, mat.glass, OX+0.5, 4.7, 8.15, scene, false);
box(3, 2.6, 0.2, mat.frame, OX+2, 1.3, 6.12);
box(3.6, 0.15, 1.6, mat.trim, OX+2, 2.8, 6.9);                     // กันสาดประตู

const glowCol = (hex, k) => lin(hex).multiplyScalar(k);

function makePath(points, hex, opt={}){
  let curve;
  if (opt.straight){ curve = new THREE.CurvePath(); for (let i=1;i<points.length;i++) curve.add(new THREE.LineCurve3(points[i-1], points[i])); }
  else curve = new THREE.CatmullRomCurve3(points, false, 'centripetal', 0.2);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, opt.straight ? 400 : 120, opt.r || 0.05, 6, false),
    new THREE.MeshBasicMaterial({ color:glowCol(hex, 0.9), transparent:true, opacity:0.6, toneMapped:false }));
  scene.add(tube);
  const N = 36;
  const dots = new THREE.InstancedMesh(new THREE.SphereGeometry(0.15, 12, 10), new THREE.MeshBasicMaterial({ color:glowCol(hex, 3.2), toneMapped:false }), N);
  const glow = new THREE.InstancedMesh(new THREE.SphereGeometry(0.36, 12, 10),
    new THREE.MeshBasicMaterial({ color:glowCol(hex, 1), transparent:true, opacity:0.22, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false }), N);
  scene.add(dots, glow);
  return { curve, tube, dots, glow, N, phase:0, kw:0, dir:1, speedK: opt.speedK || 1 };
}

const tmpM = new THREE.Matrix4(), tmpP = new THREE.Vector3();
function updatePath(p, dt){
  const active = p.kw > 0.02;
  p.tube.visible = p.glow.visible = p.dots.visible = active;
  if (!active) return;
  const speed = (reduceMotion ? 0.02 : 0.05 + Math.min(p.kw, 12) * 0.022) * p.speedK;
  p.phase = (p.phase + dt * speed * p.dir + 1) % 1;
  const shown = Math.max(6, Math.round(p.N * Math.min(1, 0.25 + p.kw / 8)));
  for (let i=0; i<p.N; i++){
    if (i >= shown){ tmpM.makeScale(0,0,0); p.dots.setMatrixAt(i, tmpM); p.glow.setMatrixAt(i, tmpM); continue; }
    const t = (i / shown + p.phase) % 1;
    const pt = p.curve.getPointAt(t, tmpP) || tmpP;
    tmpM.makeTranslation(pt.x, pt.y, pt.z);
    p.dots.setMatrixAt(i, tmpM); p.glow.setMatrixAt(i, tmpM);
  }
  p.dots.instanceMatrix.needsUpdate = true; p.glow.instanceMatrix.needsUpdate = true;
}
function setPathColor(p, hex){
  p.tube.material.color.copy(glowCol(hex, 0.9));
  p.dots.material.color.copy(glowCol(hex, 3.2));
  p.glow.material.color.copy(glowCol(hex, 1));
}

const tagLayer = document.getElementById('tags');

function addTag(title, color, anchor, focus){
  const el = document.createElement('div');
  el.className = 'tag'; el.tabIndex = 0; el.setAttribute('role','button');
  el.style.setProperty('--c', color);
  el.innerHTML = `<b>${title}</b><span>–</span>`;
  const go = () => focusOn(focus || anchor);
  el.addEventListener('click', go);
  el.addEventListener('keydown', e => { if (e.key==='Enter' || e.key===' '){ e.preventDefault(); go(); } });
  tagLayer.appendChild(el);
  const t = { el, val:el.querySelector('span'), anchor }; tags.push(t); return t;
}

  for (const t of tags){
    proj.copy(t.anchor).project(camera);
    const off = proj.z > 1 || Math.abs(proj.x) > 1.1 || Math.abs(proj.y) > 1.1;
    t.el.classList.toggle('hidden', off);
    if (!off) t.el.style.transform = `translate(${(proj.x*0.5+0.5)*w}px, ${(-proj.y*0.5+0.5)*h}px) translate(-50%,-100%)`;
  }
}

/* ================= กล้อง ================= */
let tween = null;
function flyTo(toP, toT, dur=1.2, done){
  tween = { fromP:camera.position.clone(), toP, fromT:controls.target.clone(), toT, t:0, dur, done };
}
function focusOn(target){
  setSpin(false);
  const dir = camera.position.clone().sub(controls.target).normalize();
  flyTo(target.clone().add(dir.multiplyScalar(16)).setY(Math.max(target.y + 5, 6)), target.clone());
}
const ease = x => x<.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
const btnSpin = document.getElementById('btnSpin');
function setSpin(on){ controls.autoRotate = on; btnSpin.setAttribute('aria-pressed', String(on)); }
setSpin(false);
btnSpin.addEventListener('click', () => setSpin(!controls.autoRotate));
document.getElementById('btnHome').addEventListener('click', () => flyTo(HOME.pos.clone(), HOME.target.clone()));
controls.addEventListener('start', () => { if (tween && !tween.intro) tween = null; if (controls.autoRotate) setSpin(false); });

/* ================= ช่วงเวลาของวัน ================= */
const SKY_MODES = [
  { key:'auto',  label:'บรรยากาศตามเวลาจริง' },
  { key:'day',   label:'บรรยากาศกลางวัน', hour:13 },
  { key:'dusk',  label:'บรรยากาศเย็น', hour:17.9 },
  { key:'night', label:'บรรยากาศกลางคืน', hour:21 }
];
let skyIdx = 0;
document.getElementById('btnSky').addEventListener('click', () => {
  skyIdx = (skyIdx + 1) % SKY_MODES.length;
  document.getElementById('btnSky').textContent = SKY_MODES[skyIdx].label;
  applySky();
});
const PAL = {
  day:   { top:0x2F86E8, hor:0xBFE2FF, sun:0xFFF1D6, hemiSky:0xCFE6FF, hemiGnd:0x6E9E4A },
  dusk:  { top:0x2B3F7A, hor:0xFFB073, sun:0xFF9A4D, hemiSky:0xF2B48A, hemiGnd:0x4E5E3A },
  night: { top:0x050B1C, hor:0x1A2A4A, sun:0x8FA8FF, hemiSky:0x2A3C66, hemiGnd:0x10161C }
};
const cA = new THREE.Color(), cB = new THREE.Color();
const mix3 = (key, k1, k2, w1, w2, w3) => {   // ผสมสีจาก 3 ชุด
  const a = lin(PAL.day[key]), b = lin(PAL.dusk[key]), c = lin(PAL.night[key]);
  return new THREE.Color(a.r*w1+b.r*w2+c.r*w3, a.g*w1+b.g*w2+c.g*w3, a.b*w1+b.b*w2+c.b*w3);
};
function bkkHour(){
  const d = new Date(); const utc = d.getUTCHours() + d.getUTCMinutes()/60;
  return (utc + 7) % 24;
}
let night = 0;
const ENV_MATS = [...Object.values(mat), signMat, cloudMat];
ENV_MATS.forEach(m => m.userData.envBase = m.envMapIntensity);
function applySky(){
  const m = SKY_MODES[skyIdx];
  const h = m.hour != null ? m.hour : bkkHour();
  const az = Math.PI * (h - 6) / 12;                  // 6 โมงเช้า = ตะวันออก, 6 โมงเย็น = ตะวันตก
  const elev = Math.sin(az);                           // -1..1
  const day = THREE.MathUtils.clamp(elev * 2.2, 0, 1);
  night = THREE.MathUtils.clamp(-elev * 4 + 0.15, 0, 1);
  const dusk = Math.max(0, 1 - day - night);
  const w1 = day, w2 = dusk, w3 = night, s = w1+w2+w3 || 1;

  const dir = new THREE.Vector3(Math.cos(az), Math.max(elev, -0.2) * 1.6 + 0.08, 0.55).normalize();
  if (night > 0.6) dir.set(-0.4, 0.9, 0.35).normalize();       // แสงจันทร์
  sun.position.copy(dir).multiplyScalar(80);
  sun.color.copy(mix3('sun',0,0,w1/s,w2/s,w3/s));
  sun.intensity = 2.3*day + 1.4*dusk + 0.3*night;
  hemi.color.copy(mix3('hemiSky',0,0,w1/s,w2/s,w3/s));
  hemi.groundColor.copy(mix3('hemiGnd',0,0,w1/s,w2/s,w3/s));
  hemi.intensity = 0.75*day + 0.55*dusk + 0.22*night;

  skyMat.uniforms.top.value.copy(mix3('top',0,0,w1/s,w2/s,w3/s));
  const hor = mix3('hor',0,0,w1/s,w2/s,w3/s);
  skyMat.uniforms.horizon.value.copy(hor);
  skyMat.uniforms.sunDir.value.copy(new THREE.Vector3(Math.cos(az), elev, 0.55).normalize());
  skyMat.uniforms.sunColor.value.copy(mix3('sun',0,0,w1/s,w2/s,w3/s));
  skyMat.uniforms.sunVis.value = THREE.MathUtils.clamp(elev*5+0.4, 0, 1);
  scene.fog.color.copy(hor);
  document.body.style.background = '#' + hor.clone().convertLinearToSRGB().getHexString();

  stars.material.opacity = night;
  cloudMat.color.copy(lin(0xFFFFFF)).lerp(lin(0x6C7A99), night).lerp(lin(0xFFC8A0), dusk*0.6);
  mat.windowGlow.emissiveIntensity = night*1.6 + dusk*0.5;
  mat.bulb.emissiveIntensity = night*6 + dusk*2;
  lampLights.forEach(l => l.intensity = night*1.6 + dusk*0.5);
  signMat.emissiveIntensity = 0.12 + night*0.45;
  mat.accent.emissiveIntensity = 0.15 + night*0.8;
  renderer.toneMappingExposure = 0.85 + night*0.2;
  const envK = 0.12 + 0.88*day + 0.35*dusk;               // แสงสะท้อนรอบข้างลดลงตอนกลางคืน
  ENV_MATS.forEach(m => { m.envMapIntensity = m.userData.envBase * envK; });
  bloom.strength = 0.55 + night*0.6;
  document.documentElement.dataset.sky = night > 0.5 ? 'night' : 'day';
}
applySky();
setInterval(() => { if (SKY_MODES[skyIdx].key === 'auto') applySky(); }, 60000);

/* ================= ข้อมูล ================= */
const $ = id => document.getElementById(id);
const fmt = (v, d=2) => (v == null || !isFinite(v)) ? '–' : v.toFixed(d);
function parseFields(f){
  const o = {};
  for (const k in f){ const v = f[k];
    o[k] = v.doubleValue ?? (v.integerValue != null ? Number(v.integerValue) : undefined) ?? v.timestampValue ?? v.stringValue ?? v.booleanValue; }
  return o;
}
async function fetchDoc(path){
  const url = `https://firestore.googleapis.com/v1/projects/${CONFIG.project}/databases/(default)/documents/${path}?key=${CONFIG.apiKey}`;
  const r = await fetch(url, { cache:'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return parseFields((await r.json()).fields || {});
}
function simSolarKw(d = new Date()){
  const h = bkkHour();
  const s = Math.sin(Math.PI * (h - 6.2) / 12.4);
  if (s <= 0) return 0;
  return CONFIG.solarKwp * 0.78 * Math.pow(s, 1.25) * (0.88 + 0.12 * Math.sin(d.getTime()/90000));
}
function simLoadKw(d = new Date()){
  const h = bkkHour(), wd = d.getUTCDay();
  return (wd>0 && wd<6 && h>8 && h<18.5) ? 4.2 + 1.2*Math.sin(d.getTime()/300000) : 0.9;
}
let state = { mode:'connecting', solarKw:0, gridKw:0, loadKw:0 };
async function refresh(){
  const now = new Date();
  let meter = null, solarKw = null, solarReal = false, err = null;
  try { meter = await fetchDoc(CONFIG.meterDoc); } catch(e){ err = e; }
  if (CONFIG.solarDoc){
    try { const s = await fetchDoc(CONFIG.solarDoc); if (typeof s[CONFIG.solarField] === 'number'){ solarKw = s[CONFIG.solarField]/1000; solarReal = true; } } catch(e){}
  }
  if (solarKw == null) solarKw = simSolarKw(now);
  if (meter && typeof meter.p_total === 'number'){
    const gridKw = meter.p_total / 1000;
    const updated = meter.updatedAt ? new Date(meter.updatedAt) : null;
    const ageMin = updated ? (now - updated) / 60000 : Infinity;
    state = { mode: ageMin > CONFIG.staleMin ? 'stale' : 'live', gridKw, solarKw, solarReal, loadKw: Math.max(0, gridKw + solarKw), meter, ageMin };
  } else {
    const loadKw = simLoadKw(now);
    state = { mode:'demo', gridKw: loadKw - solarKw, solarKw, solarReal:false, loadKw, meter:{ v_ln_avg:231.8, i_avg:6.4, pf_total:0.93, kwh_import:36.59, temp:31.3 }, err };
  }
  render();
}
function ago(min){
  if (!isFinite(min)) return 'ไม่ทราบเวลา';
  if (min < 1) return 'เมื่อสักครู่';
  if (min < 60) return `${Math.round(min)} นาทีที่แล้ว`;
  if (min < 1440) return `${Math.round(min/60)} ชั่วโมงที่แล้ว`;
  return `${Math.round(min/1440)} วันที่แล้ว`;
}
function render(){
  const s = state, m = s.meter || {};
  $('status').className = 'status ' + (s.mode === 'live' ? 'live' : s.mode === 'stale' ? 'stale' : 'demo');
  $('statusText').textContent =
    s.mode === 'live'  ? `ข้อมูลสดจาก IE-01 อัปเดต${ago(s.ageMin)}` :
    s.mode === 'stale' ? `ข้อมูลค้าง อัปเดตล่าสุด${ago(s.ageMin)}` :
    `โหมดตัวอย่าง อ่าน Firestore ไม่ได้${s.err ? ' (' + s.err.message + ')' : ''}`;
  const exporting = s.gridKw < -0.02;
  $('vSolar').textContent = fmt(s.solarKw);
  $('nSolar').textContent = s.solarReal ? `${Math.round(s.solarKw / CONFIG.solarKwp * 100)}% ของกำลังติดตั้ง` : 'ค่าจำลอง ยังไม่ได้ต่อ inverter';
  $('vGrid').textContent = (exporting ? '−' : '') + fmt(Math.abs(s.gridKw));
  $('nGrid').textContent = exporting ? 'ขายไฟคืนการไฟฟ้า' : 'ซื้อไฟจากการไฟฟ้า';
  $('tGrid').style.setProperty('--c', exporting ? 'var(--export)' : 'var(--grid)');
  $('vLoad').textContent = fmt(s.loadKw);
  $('nLoad').textContent = s.loadKw > 0.05 ? `โซลาร์จ่ายได้ ${Math.min(100, Math.round(s.solarKw / s.loadKw * 100))}% ของโหลด` : '';
  $('fV').textContent   = m.v_ln_avg != null ? fmt(m.v_ln_avg,1) + ' V' : '–';
  $('fI').textContent   = m.i_avg != null ? fmt(m.i_avg,2) + ' A' : '–';
  $('fPF').textContent  = m.pf_total != null ? fmt(m.pf_total,3) : '–';
  $('fKwh').textContent = m.kwh_import != null ? fmt(m.kwh_import,2) + ' kWh' : '–';
  $('fT').textContent   = m.temp != null ? fmt(m.temp,1) + ' °C' : '–';

  T.pv.val.textContent    = fmt(s.solarKw) + ' kW';
  T.inv.val.textContent   = s.solarKw > 0.02 ? 'กำลังผลิต' : 'หยุดผลิต';
  T.meter.val.textContent = (exporting ? '↑ ' : '↓ ') + fmt(Math.abs(s.gridKw)) + ' kW';
  T.pole.val.textContent  = exporting ? 'รับไฟคืน' : 'จ่ายไฟเข้า';
  T.load.val.textContent  = fmt(s.loadKw) + ' kW';
  const gcss = exporting ? 'var(--export)' : 'var(--grid)';
  T.meter.el.style.setProperty('--c', gcss); T.pole.el.style.setProperty('--c', gcss);

  paths.solar.kw = s.solarKw; paths.load.kw = s.loadKw;
  paths.grid.kw = Math.abs(s.gridKw); paths.grid.dir = exporting ? -1 : 1;
  setPathColor(paths.grid, exporting ? HEX.export : HEX.grid);
  mat.panel.emissiveIntensity = Math.min(1, s.solarKw / CONFIG.solarKwp) * 0.35;   // แผงเรืองตามกำลังผลิต
}

/* ================= วนเฟรม ================= */
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + 'px'; renderer.domElement.style.height = h + 'px';
  composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

function endIntro(){ document.body.classList.remove('intro'); if (!reduceMotion) setSpin(true); }
if (reduceMotion) endIntro();
else { flyTo(HOME.pos.clone(), HOME.target.clone(), 3.2, endIntro); tween.intro = true; }

const clock = new THREE.Clock();
let useComposer = true, perfN = 0, perfSum = 0;
function loop(){
  const raw = clock.getDelta(), dt = Math.min(raw, 0.1);
  if (tween){
    tween.t = Math.min(1, tween.t + Math.min(raw, 0.5) / tween.dur);
    const k = ease(tween.t);
    camera.position.lerpVectors(tween.fromP, tween.toP, k);
    controls.target.lerpVectors(tween.fromT, tween.toT, k);
    if (tween.t >= 1){ const d = tween.done; tween = null; d && d(); }
  }
  controls.update();
  for (const k in paths) updatePath(paths[k], dt);
  if (!reduceMotion){ fans.forEach(f => f.rotation.y += dt*6); clouds.rotation.y += dt*0.004; }
  // เครื่องช้า: ปิดแสงเรืองและลดความละเอียดอัตโนมัติ
  if (useComposer && !tween && perfN < 90){ perfN++; perfSum += raw;
    if (perfN === 90 && perfSum/90 > 0.045){ useComposer = false; renderer.setPixelRatio(1); resize(); } }
  if (useComposer) composer.render(); else renderer.render(scene, camera);
  placeTags();
  requestAnimationFrame(loop);
}
loop();
refresh();
setInterval(refresh, CONFIG.pollSec * 1000);
</script>
