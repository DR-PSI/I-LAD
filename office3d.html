<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TiCC · Office 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============ ตั้งค่าสี ============ */
:root{
  --ink:#1C2B3A; --ink-2:#506173; --paper:#EEF2F4; --card:rgba(255,255,255,.92);
  --brand:#1F5FB0; --solar:#F5A300; --grid:#1E7BFF; --export:#0FB866; --load:#A63DF0; --warn:#E5480E;
  --line:rgba(28,43,58,.12);
  --sans:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#E6EDF3; --ink-2:#9AAABB; --paper:#0F1722; --card:rgba(20,30,42,.9); --line:rgba(230,237,243,.14); --brand:#6FA3DA; }
}
:root[data-theme="dark"]{ --ink:#E6EDF3; --ink-2:#9AAABB; --paper:#0F1722; --card:rgba(20,30,42,.9); --line:rgba(230,237,243,.14); --brand:#6FA3DA; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ height:100%; margin:0; }
body{ background:linear-gradient(180deg,#5FAEF5 0%,#A9D6FF 38%,#E4F3FF 62%,#EEF6EC 100%); color:var(--ink); font-family:var(--sans); overflow:hidden; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body{ background:linear-gradient(180deg,#16212E 0%,var(--paper) 60%); } }

#stage{ position:fixed; inset:0; }
#stage canvas{ display:block; outline:none; }

/* ป้ายบนอุปกรณ์ */
#tags{ position:fixed; inset:0; pointer-events:none; }
.tag{ position:absolute; transform:translate(-50%,-100%); pointer-events:auto; cursor:pointer;
  background:var(--card); border:1px solid var(--line); border-left:4px solid var(--c); border-radius:6px;
  padding:5px 10px 6px; white-space:nowrap; font-size:12px; line-height:1.25; color:var(--ink);
  box-shadow:0 4px 14px rgba(20,40,60,.12); backdrop-filter:blur(6px); }
.tag b{ display:block; font-weight:600; font-size:12px; }
.tag span{ font-family:var(--mono); font-size:13px; font-weight:600; color:var(--c); }
.tag:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
.tag.hidden{ display:none; }

/* ส่วนหัว */
header{ position:fixed; top:calc(env(safe-area-inset-top,0px) + 16px); left:20px; right:20px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; pointer-events:none; }
.brand{ pointer-events:auto; }
.brand h1{ margin:0; font-size:26px; letter-spacing:.06em; font-weight:600; color:var(--brand); }
.brand p{ margin:2px 0 0; font-size:14px; color:var(--ink-2); }
.status{ margin-top:8px; display:inline-flex; align-items:center; gap:8px; font-size:13px; padding:4px 10px; border-radius:999px; background:var(--card); border:1px solid var(--line); }
.status i{ width:8px; height:8px; border-radius:50%; background:#999; }
.status.live i{ background:var(--export); box-shadow:0 0 0 3px rgba(15,184,102,.25); }
.status.stale i{ background:var(--warn); }
.status.demo i{ background:var(--solar); }
.tools{ display:flex; gap:8px; pointer-events:auto; }
.tools button{ font:500 13px var(--sans); color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; white-space:nowrap; }
.tools button[aria-pressed="true"]{ border-color:var(--brand); color:var(--brand); }
.tools button:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }

/* สมการพลังงาน */
#balance{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  width:min(860px, calc(100% - 24px)); background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px 18px 12px; backdrop-filter:blur(8px); box-shadow:0 10px 30px rgba(20,40,60,.14); }
.eq{ display:grid; grid-template-columns:1fr auto 1fr auto 1fr; align-items:center; gap:6px 14px; }
.term .k{ font-size:13px; color:var(--ink-2); display:flex; align-items:center; gap:6px; }
.term .k::before{ content:""; width:10px; height:10px; border-radius:2px; background:var(--c); }
.term .v{ font-family:var(--mono); font-weight:600; font-size:clamp(22px,3.4vw,34px); color:var(--c); line-height:1.1; }
.term .v small{ font-size:.5em; margin-left:4px; color:var(--ink-2); }
.term .n{ font-size:12px; color:var(--ink-2); min-height:1.3em; }
.op{ font-family:var(--mono); font-size:28px; color:var(--ink-2); }
.facts{ display:flex; flex-wrap:wrap; gap:6px 22px; margin-top:10px; padding-top:9px; border-top:1px solid var(--line); font-size:13px; color:var(--ink-2); }
.facts span b{ font-family:var(--mono); color:var(--ink); font-weight:600; margin-left:4px; }
.note{ margin-top:6px; font-size:11.5px; color:var(--ink-2); }

@media (max-width:640px){
  header{ left:12px; right:12px; }
  .brand h1{ font-size:21px; }
  .tools button{ padding:6px 9px; font-size:12px; }
  .eq{ grid-template-columns:1fr auto 1fr; }
  .eq .op.eqsign{ display:none; }
  .eq .term.load{ grid-column:1 / -1; border-top:1px dashed var(--line); padding-top:6px; }
  .tag{ font-size:11px; padding:4px 8px; }
  .facts{ gap:4px 14px; font-size:12px; }
  .note{ display:none; }
}
</style>
</head>
<body>
<div id="stage" aria-label="แบบจำลอง 3 มิติของอาคารสำนักงานและระบบโซลาร์"></div>
<div id="tags"></div>

<header>
  <div class="brand">
    <h1>TiCC</h1>
    <p>อาคารสำนักงาน Tinamics</p>
    <div class="status demo" id="status"><i></i><span id="statusText">กำลังเชื่อมต่อ…</span></div>
  </div>
  <div class="tools">
    <button id="btnHome" type="button">มุมภาพรวม</button>
    <button id="btnSpin" type="button" aria-pressed="true">หมุนอัตโนมัติ</button>
  </div>
</header>

<section id="balance" aria-live="polite">
  <div class="eq">
    <div class="term" style="--c:var(--solar)">
      <div class="k">โซลาร์ 10 kW</div>
      <div class="v"><span id="vSolar">–</span><small>kW</small></div>
      <div class="n" id="nSolar"></div>
    </div>
    <div class="op">+</div>
    <div class="term" id="tGrid" style="--c:var(--grid)">
      <div class="k">การไฟฟ้า (IE-01)</div>
      <div class="v"><span id="vGrid">–</span><small>kW</small></div>
      <div class="n" id="nGrid"></div>
    </div>
    <div class="op eqsign">=</div>
    <div class="term load" style="--c:var(--load)">
      <div class="k">โหลดอาคาร</div>
      <div class="v"><span id="vLoad">–</span><small>kW</small></div>
      <div class="n" id="nLoad"></div>
    </div>
  </div>
  <div class="facts">
    <span>แรงดัน L-N<b id="fV">–</b></span>
    <span>กระแสเฉลี่ย<b id="fI">–</b></span>
    <span>PF<b id="fPF">–</b></span>
    <span>พลังงานสะสม<b id="fKwh">–</b></span>
    <span>อุณหภูมิตู้<b id="fT">–</b></span>
  </div>
  <div class="note" id="note">คำนวณโดยถือว่า IE-01 ติดที่จุดรับไฟการไฟฟ้า ค่าบวกคือซื้อเข้า ค่าลบคือขายคืน</div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ======================= แก้ตรงนี้ ======================= */
const CONFIG = {
  project:  'motoreye-b8829',
  apiKey:   'AIzaSyA9duN7uzwd8LHZuhFj5LBcKSx5k06C-a8',
  meterDoc: 'plants/ABC/rooms/IE-01',   // มิเตอร์จุดรับไฟ (PAC 3100)
  solarDoc: null,                       // ใส่ path เมื่อต่อ inverter แล้ว เช่น 'plants/ABC/rooms/PV-01'
  solarField: 'p_total',                // ฟิลด์กำลังผลิต (W) ใน solarDoc
  solarKwp: 10,
  pollSec: 30,
  staleMin: 10
};
/* ========================================================= */

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');

/* ---------- ฉาก ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xCFE7FA, 130, 230);

const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 400);
const narrow = innerWidth < 640;
const HOME = narrow
  ? { pos:new THREE.Vector3(30, 44, 70), target:new THREE.Vector3(-6, 0, 4) }
  : { pos:new THREE.Vector3(34, 26, 42), target:new THREE.Vector3(-3, 3, 2) };
camera.position.copy(HOME.pos);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.target);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 10;
controls.maxDistance = 110;
controls.autoRotate = !reduceMotion;
controls.autoRotateSpeed = 0.35;

scene.add(new THREE.HemisphereLight(0xBFE0FF, 0x6E9E4A, 0.8));
const sun = new THREE.DirectionalLight(0xFFE2B0, 1.3);
sun.position.set(-25, 40, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-40, right:40, top:40, bottom:-40, near:1, far:120 });
sun.shadow.bias = -0.0005;
scene.add(sun);

const M = (color, o={}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness:0.8, metalness:0.05 }, o));
const mat = {
  ground:M(0x2F8F22, {roughness:1}), road:M(0x3B434D, {roughness:0.9}), concrete:M(0xF1ECE2), trim:M(0xC9D2DC), metal:M(0xD5DEE8, {metalness:0.25, roughness:0.45}),
  roofMetal:M(0x34404E, {metalness:0.5, roughness:0.42}), rib:M(0x46556A, {metalness:0.55, roughness:0.35}), roofSlab:M(0x39434E, {roughness:0.85}), glass:M(0x2A8FE0, {transparent:true, opacity:0.72, roughness:0.05, metalness:0.55, emissive:0x0B3E73, emissiveIntensity:0.25}),
  frame:M(0x26313D), door:M(0xBFC9D3, {metalness:0.35}), panel:M(0x0D2660, {roughness:0.28, metalness:0.35, emissive:0x041438, emissiveIntensity:0.25}), cell:M(0x5D7BB8, {roughness:0.4}),
  panelFrame:M(0xC7CFD7, {metalness:0.7, roughness:0.3}), white:M(0xFFFFFF), cabinet:M(0x8E9AA6, {metalness:0.4}),
  pole:M(0xA8A59C), leaf:M(0x3FAE49, {roughness:0.7}), leaf2:M(0x7CC63E, {roughness:0.7}), trunk:M(0x7A4E2D), screen:M(0x1C3A24, {emissive:0x3CFF7A, emissiveIntensity:0.8}),
  stripe:M(0xFFFFFF, {roughness:0.6}), accent:M(0xF07A1A, {roughness:0.5})
};

function box(w,h,d,m,x,y,z,parent=scene){
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
  mesh.position.set(x,y,z); mesh.castShadow = true; mesh.receiveShadow = true;
  parent.add(mesh); return mesh;
}

/* ---------- พื้นและถนน ---------- */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(160,160), mat.ground);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
box(160, 0.05, 9, mat.road, 0, 0.03, 19);
box(14, 0.06, 8, mat.road, -10, 0.04, 11.5);   // ลานหน้าโกดัง
box(10, 0.06, 6, mat.trim, 7, 0.04, 9.5);      // ลานหน้าออฟฟิศ
for (let i=-7;i<=7;i++) box(3, 0.02, 0.25, mat.stripe, i*10, 0.07, 19);   // เส้นถนน

/* ---------- อาคารสำนักงาน 2 ชั้น ---------- */
const OX = 7;
box(18, 8, 12, mat.concrete, OX, 4, 0);
box(18.4, 0.6, 12.4, mat.trim, OX, 8.3, 0);                 // parapet
box(18.5, 0.18, 0.1, mat.accent, OX, 8.55, 6.22);           // แถบสีแบรนด์
box(17.4, 0.12, 11.4, mat.roofSlab, OX, 8.62, 0);            // พื้นหลังคาสำนักงาน
box(2.4, 1.0, 1.6, mat.cabinet, OX+5, 9.2, -2.5);            // แอร์บนหลังคา
box(2.4, 1.0, 1.6, mat.cabinet, OX+2, 9.2, -2.5);
for (let f=0; f<2; f++){
  const y = 1.9 + f*4;
  box(15.5, 3.0, 0.15, mat.glass, OX+0.8, y, 6.05);         // กระจกหน้า
  for (let i=0; i<=6; i++) box(0.12, 3.0, 0.25, mat.frame, OX-6.95+i*2.58, y, 6.1);
  box(18.2, 0.35, 0.5, mat.trim, OX, y+1.7, 6.15);           // แนวพื้น
}
box(16, 0.25, 2.2, mat.trim, OX+0.5, 4.05, 7.1);             // ระเบียงชั้น 2
box(16, 1.0, 0.06, mat.glass, OX+0.5, 4.7, 8.15);
box(3, 2.6, 0.2, mat.frame, OX+2, 1.3, 6.1);                 // ประตูทางเข้า

/* ---------- โกดัง + หลังคาจั่ว ---------- */
const WX = -10, WZ = 1, WD = 14, WH = 6.5, RISE = 2.2;
box(12, WH, WD, mat.metal, WX, WH/2, WZ);
box(5.2, 4.4, 0.15, mat.door, WX-1.5, 2.2, WZ+WD/2+0.05);    // ประตูม้วน
for (let i=0;i<10;i++) box(5.2, 0.04, 0.2, mat.trim, WX-1.5, 0.3+i*0.44, WZ+WD/2+0.13);

const roofShape = new THREE.Shape();
roofShape.moveTo(-WD/2-0.4, 0); roofShape.lineTo(WD/2+0.4, 0); roofShape.lineTo(0, RISE); roofShape.closePath();
const roofGeo = new THREE.ExtrudeGeometry(roofShape, { depth:12.6, bevelEnabled:false });
roofGeo.rotateY(Math.PI/2);
const roof = new THREE.Mesh(roofGeo, mat.roofMetal);
roof.position.set(WX-6.3, WH, WZ); roof.castShadow = roof.receiveShadow = true; scene.add(roof);

/* ---------- ลอนหลังคาเมทัลชีท ---------- */
{
  const sl = Math.atan2(RISE, WD/2+0.4), len = Math.hypot(RISE, WD/2+0.4);
  [1,-1].forEach(side => {
    const g = new THREE.Group();
    g.position.set(WX, WH + RISE/2 + 0.03, WZ + side*(WD/2+0.4)/2);
    g.rotation.x = side*sl; scene.add(g);
    for (let x=-6.1; x<=6.1; x+=0.55) box(0.06, 0.06, len, mat.rib, x, 0, 0, g);
  });
  box(12.8, 0.18, 0.3, mat.rib, WX, WH+RISE+0.02, WZ);         // ครอบสันหลังคา
}

/* ---------- แผงโซลาร์ 18 แผง ≈ 10 kWp บนหลังคาด้านหน้า ---------- */
const slope = Math.atan2(RISE, WD/2+0.4);
const pv = new THREE.Group();
pv.position.set(WX, WH + RISE/2 + 0.18, WZ + (WD/2+0.4)/2);
pv.rotation.x = slope;
scene.add(pv);
for (let r=0; r<2; r++) for (let c=0; c<9; c++){
  const x = -4.6 + c*1.15, z = -1.25 + r*2.4;
  box(1.08, 0.05, 2.25, mat.panelFrame, x, 0, z, pv);
  box(1.0, 0.06, 2.15, mat.panel, x, 0.01, z, pv);
  box(0.02, 0.065, 2.1, mat.cell, x, 0.012, z, pv);
  for (let k=-2;k<=2;k++) box(0.98, 0.065, 0.02, mat.cell, x, 0.012, z + k*0.43, pv);
}

/* ---------- Inverter, ตู้ MDB, มิเตอร์ IE-01 ---------- */
const FRONT = WZ + WD/2;
box(0.55, 0.75, 0.25, mat.white, -5.4, 2.0, FRONT+0.15);     // Huawei SUN2000
box(0.3, 0.05, 0.02, mat.screen, -5.4, 2.2, FRONT+0.28);
box(1.4, 2.0, 0.6, mat.cabinet, -7.3, 1.0, FRONT+0.32);       // MDB
box(0.35, 0.3, 0.04, mat.screen, -7.0, 1.5, FRONT+0.63);      // PAC 3100

/* ---------- เสาไฟฟ้า + หม้อแปลง ---------- */
const PX = -24, PZ = 15;
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.25, 10, 10), mat.pole);
pole.position.set(PX, 5, PZ); pole.castShadow = true; scene.add(pole);
box(2.4, 0.15, 0.15, mat.pole, PX, 9.2, PZ);
const tx = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 1.1, 14), mat.cabinet);
tx.position.set(PX+0.6, 7.6, PZ); tx.castShadow = true; scene.add(tx);

/* ---------- ต้นไม้ ---------- */
[[18,0,10],[20.5,0,4],[-20,0,-6],[-2,0,13.5],[14,0,-9]].forEach(([x,,z])=>{
  const t = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.2,2,6), mat.trunk);
  t.position.set(x,1,z); t.castShadow = true; scene.add(t);
  const l = new THREE.Mesh(new THREE.IcosahedronGeometry(1.4,0), (x+z)%2 ? mat.leaf : mat.leaf2);
  l.position.set(x,2.7,z); l.castShadow = true; scene.add(l);
});

/* ---------- เส้นทางพลังงาน ---------- */
const V = (x,y,z) => new THREE.Vector3(x,y,z);
const COLORS = { solar:0xFFB300, grid:0x1E7BFF, export:0x10D070, load:0xB24BFF };

function makePath(points, color, opt={}){
  let curve;
  if (opt.straight){ curve = new THREE.CurvePath(); for (let i=1;i<points.length;i++) curve.add(new THREE.LineCurve3(points[i-1], points[i])); }
  else curve = new THREE.CatmullRomCurve3(points, false, 'centripetal', 0.2);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, opt.straight ? 400 : 120, opt.r || 0.05, 6, false),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.55, toneMapped:false }));
  scene.add(tube);
  const N = 36;
  const dots = new THREE.InstancedMesh(new THREE.SphereGeometry(0.17, 12, 10), new THREE.MeshBasicMaterial({ color, toneMapped:false }), N);
  const glow = new THREE.InstancedMesh(new THREE.SphereGeometry(0.42, 12, 10),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.2, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false }), N);
  scene.add(dots, glow);
  return { curve, tube, dots, glow, N, phase:0, kw:0, dir:1 };
}
const paths = {
  // เดินสายจากแผง ลงชายคา ไปมุมตึก แล้วลงตามขอบตึกเข้า inverter และตู้ MDB
  solar: makePath([
    V(-5.45, 7.25, 6.95), V(-5.45, 6.62, FRONT+0.42), V(-3.82, 6.62, FRONT+0.42),
    V(-3.82, 6.45, FRONT+0.1), V(-3.82, 2.2, FRONT+0.1), V(-5.1, 2.2, FRONT+0.18),
    V(-5.4, 1.55, FRONT+0.32), V(-6.55, 1.55, FRONT+0.65)
  ], COLORS.solar, { straight:true, r:0.07 }),
  grid:  makePath([V(PX, 9.3, PZ), V(-16, 7.4, 12.5), V(-8.5, 5.5, FRONT+1.0), V(-7.6, 2.1, FRONT+0.65)], COLORS.grid),
  load:  makePath([V(-6.6, 0.4, FRONT+0.75), V(-3, 0.25, 9.6), V(4, 0.25, 8.6), V(OX+2, 0.3, 7.0), V(OX+2, 2.2, 6.3), V(OX, 6, 3)], COLORS.load)
};

const tmpM = new THREE.Matrix4(), tmpP = new THREE.Vector3();
function updatePath(p, dt){
  const active = p.kw > 0.02;
  p.tube.visible = active;
  p.glow.visible = active;
  if (!active){ p.dots.visible = false; return; }
  p.dots.visible = true;
  const speed = reduceMotion ? 0.02 : 0.05 + Math.min(p.kw, 12) * 0.022;
  p.phase = (p.phase + dt * speed * p.dir + 1) % 1;
  const shown = Math.max(6, Math.round(p.N * Math.min(1, 0.25 + p.kw / 8)));
  for (let i=0; i<p.N; i++){
    if (i >= shown){ tmpM.makeScale(0,0,0); p.dots.setMatrixAt(i, tmpM); p.glow.setMatrixAt(i, tmpM); continue; }
    const t = (i / shown + p.phase) % 1;
    const pt = p.curve.getPointAt(t, tmpP) || tmpP;   // CurvePath คืนค่าใหม่ ไม่ใช้ target
    tmpM.makeTranslation(pt.x, pt.y, pt.z);
    p.dots.setMatrixAt(i, tmpM); p.glow.setMatrixAt(i, tmpM);
  }
  p.dots.instanceMatrix.needsUpdate = true; p.glow.instanceMatrix.needsUpdate = true;
}

/* ---------- ป้ายลอย ---------- */
const tagLayer = document.getElementById('tags');
const tags = [];
function addTag(key, title, color, anchor, focus){
  const el = document.createElement('div');
  el.className = 'tag'; el.tabIndex = 0; el.setAttribute('role','button');
  el.style.setProperty('--c', color);
  el.innerHTML = `<b>${title}</b><span>–</span>`;
  const go = () => focusOn(focus || anchor);
  el.addEventListener('click', go);
  el.addEventListener('keydown', e => { if (e.key==='Enter' || e.key===' '){ e.preventDefault(); go(); } });
  tagLayer.appendChild(el);
  const t = { key, el, val:el.querySelector('span'), anchor }; tags.push(t); return t;
}
const T = {
  pv:    addTag('pv', 'แผงโซลาร์ 18 แผง', 'var(--solar)', V(WX, 9.6, 4.2)),
  inv:   addTag('inv','Inverter SUN2000-10KTL', 'var(--solar)', V(-2.6, 6.2, FRONT+0.3), V(-5.4, 2.0, FRONT+0.3)),
  meter: addTag('meter','ตู้ MDB / มิเตอร์ IE-01', 'var(--grid)', V(-11.2, 1.4, FRONT+0.4), V(-7.3, 1.2, FRONT+0.4)),
  pole:  addTag('pole','การไฟฟ้า', 'var(--grid)', V(PX, 10.6, PZ)),
  load:  addTag('load','อาคารสำนักงาน', 'var(--load)', V(OX, 10, 0))
};

const proj = new THREE.Vector3();
function placeTags(){
  const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
  for (const t of tags){
    proj.copy(t.anchor).project(camera);
    const off = proj.z > 1 || proj.x < -1.1 || proj.x > 1.1 || proj.y < -1.1 || proj.y > 1.1;
    t.el.classList.toggle('hidden', off);
    if (!off) t.el.style.transform = `translate(${(proj.x*0.5+0.5)*w}px, ${(-proj.y*0.5+0.5)*h}px) translate(-50%,-100%)`;
  }
}
tags.forEach(t => { t.el.style.left = '0'; t.el.style.top = '0'; });

/* ---------- ซูมไปที่อุปกรณ์ ---------- */
let tween = null;
function focusOn(target){
  setSpin(false);
  const dir = camera.position.clone().sub(controls.target).normalize();
  const to = target.clone().add(dir.multiplyScalar(16)).setY(Math.max(target.y + 5, 6));
  tween = { fromP:camera.position.clone(), toP:to, fromT:controls.target.clone(), toT:target.clone(), t:0 };
}
function goHome(){ tween = { fromP:camera.position.clone(), toP:HOME.pos.clone(), fromT:controls.target.clone(), toT:HOME.target.clone(), t:0 }; }
const ease = x => x<.5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;

const btnSpin = document.getElementById('btnSpin');
function setSpin(on){ controls.autoRotate = on; btnSpin.setAttribute('aria-pressed', String(on)); }
if (reduceMotion) setSpin(false);
btnSpin.addEventListener('click', () => setSpin(!controls.autoRotate));
document.getElementById('btnHome').addEventListener('click', goHome);
controls.addEventListener('start', () => { tween = null; if (controls.autoRotate) setSpin(false); });

/* ---------- ข้อมูล ---------- */
const $ = id => document.getElementById(id);
const fmt = (v, d=2) => (v == null || !isFinite(v)) ? '–' : v.toFixed(d);

function parseFields(f){
  const o = {};
  for (const k in f){
    const v = f[k];
    o[k] = v.doubleValue ?? (v.integerValue != null ? Number(v.integerValue) : undefined) ?? v.timestampValue ?? v.stringValue ?? v.booleanValue;
  }
  return o;
}
async function fetchDoc(path){
  const url = `https://firestore.googleapis.com/v1/projects/${CONFIG.project}/databases/(default)/documents/${path}?key=${CONFIG.apiKey}`;
  const r = await fetch(url, { cache:'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return parseFields((await r.json()).fields || {});
}

// โซลาร์จำลองตามเวลา ใช้จนกว่าจะต่อ inverter
function simSolarKw(d = new Date()){
  const h = d.getHours() + d.getMinutes()/60;
  const s = Math.sin(Math.PI * (h - 6.2) / 12.4);
  if (s <= 0) return 0;
  const cloud = 0.88 + 0.12 * Math.sin(d.getTime()/90000);
  return CONFIG.solarKwp * 0.78 * Math.pow(s, 1.25) * cloud;
}
function simLoadKw(d = new Date()){
  const h = d.getHours() + d.getMinutes()/60, wd = d.getDay();
  const work = (wd>0 && wd<6 && h>8 && h<18.5) ? 4.2 + 1.2*Math.sin(d.getTime()/300000) : 0.9;
  return work;
}

let state = { mode:'connecting' };
async function refresh(){
  const now = new Date();
  let meter = null, solarKw = null, solarReal = false, err = null;
  try { meter = await fetchDoc(CONFIG.meterDoc); } catch(e){ err = e; }
  if (CONFIG.solarDoc){
    try { const s = await fetchDoc(CONFIG.solarDoc); if (typeof s[CONFIG.solarField] === 'number'){ solarKw = s[CONFIG.solarField]/1000; solarReal = true; } } catch(e){}
  }
  if (solarKw == null) solarKw = simSolarKw(now);

  if (meter && typeof meter.p_total === 'number'){
    const gridKw = meter.p_total / 1000;
    const updated = meter.updatedAt ? new Date(meter.updatedAt) : null;
    const ageMin = updated ? (now - updated) / 60000 : Infinity;
    state = { mode: ageMin > CONFIG.staleMin ? 'stale' : 'live', gridKw, solarKw, solarReal, loadKw: Math.max(0, gridKw + solarKw), meter, ageMin };
  } else {
    const loadKw = simLoadKw(now);
    state = { mode:'demo', gridKw: loadKw - solarKw, solarKw, solarReal:false, loadKw, meter: { v_ln_avg:231.8, i_avg:6.4, pf_total:0.93, kwh_import:36.59, temp:31.3 }, err };
  }
  render();
}

function ago(min){
  if (!isFinite(min)) return 'ไม่ทราบเวลา';
  if (min < 1) return 'เมื่อสักครู่';
  if (min < 60) return `${Math.round(min)} นาทีที่แล้ว`;
  if (min < 1440) return `${Math.round(min/60)} ชั่วโมงที่แล้ว`;
  return `${Math.round(min/1440)} วันที่แล้ว`;
}

function render(){
  const s = state, m = s.meter || {};
  const st = $('status');
  st.className = 'status ' + (s.mode === 'live' ? 'live' : s.mode === 'stale' ? 'stale' : 'demo');
  $('statusText').textContent =
    s.mode === 'live'  ? `ข้อมูลสดจาก IE-01 อัปเดต${ago(s.ageMin)}` :
    s.mode === 'stale' ? `ข้อมูลค้าง อัปเดตล่าสุด${ago(s.ageMin)}` :
    `โหมดตัวอย่าง อ่าน Firestore ไม่ได้${s.err ? ' (' + s.err.message + ')' : ''}`;

  const exporting = s.gridKw < -0.02;
  $('vSolar').textContent = fmt(s.solarKw);
  $('nSolar').textContent = s.solarReal ? `${Math.round(s.solarKw / CONFIG.solarKwp * 100)}% ของกำลังติดตั้ง` : 'ค่าจำลอง ยังไม่ได้ต่อ inverter';
  $('vGrid').textContent = (exporting ? '−' : '') + fmt(Math.abs(s.gridKw));
  $('nGrid').textContent = exporting ? 'ขายไฟคืนการไฟฟ้า' : 'ซื้อไฟจากการไฟฟ้า';
  $('tGrid').style.setProperty('--c', exporting ? 'var(--export)' : 'var(--grid)');
  $('vLoad').textContent = fmt(s.loadKw);
  $('nLoad').textContent = s.loadKw > 0.05 ? `โซลาร์จ่ายได้ ${Math.min(100, Math.round(s.solarKw / s.loadKw * 100))}% ของโหลด` : '';

  $('fV').textContent   = m.v_ln_avg != null ? fmt(m.v_ln_avg,1) + ' V' : '–';
  $('fI').textContent   = m.i_avg != null ? fmt(m.i_avg,2) + ' A' : '–';
  $('fPF').textContent  = m.pf_total != null ? fmt(m.pf_total,3) : '–';
  $('fKwh').textContent = m.kwh_import != null ? fmt(m.kwh_import,2) + ' kWh' : '–';
  $('fT').textContent   = m.temp != null ? fmt(m.temp,1) + ' °C' : '–';

  T.pv.val.textContent    = fmt(s.solarKw) + ' kW';
  T.inv.val.textContent   = s.solarKw > 0.02 ? 'กำลังผลิต' : 'หยุดผลิต';
  T.meter.val.textContent = (exporting ? '↑ ' : '↓ ') + fmt(Math.abs(s.gridKw)) + ' kW';
  T.pole.val.textContent  = exporting ? 'รับไฟคืน' : 'จ่ายไฟเข้า';
  T.load.val.textContent  = fmt(s.loadKw) + ' kW';
  T.meter.el.style.setProperty('--c', exporting ? 'var(--export)' : 'var(--grid)');
  T.pole.el.style.setProperty('--c', exporting ? 'var(--export)' : 'var(--grid)');

  paths.solar.kw = s.solarKw;
  paths.load.kw  = s.loadKw;
  paths.grid.kw  = Math.abs(s.gridKw);
  paths.grid.dir = exporting ? -1 : 1;
  const gc = exporting ? COLORS.export : COLORS.grid;
  paths.grid.dots.material.color.setHex(gc);
  paths.grid.glow.material.color.setHex(gc);
  paths.grid.tube.material.color.setHex(gc);
}

/* ---------- วนเฟรม ---------- */
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + 'px'; renderer.domElement.style.height = h + 'px';
  camera.aspect = w / h;
  camera.fov = 40;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
function loop(){
  const dt = Math.min(clock.getDelta(), 0.1);
  if (tween){
    tween.t = Math.min(1, tween.t + dt / 1.2);
    const k = ease(tween.t);
    camera.position.lerpVectors(tween.fromP, tween.toP, k);
    controls.target.lerpVectors(tween.fromT, tween.toT, k);
    if (tween.t >= 1) tween = null;
  }
  controls.update();
  for (const k in paths) updatePath(paths[k], dt);
  renderer.render(scene, camera);
  placeTags();
  requestAnimationFrame(loop);
}
loop();
refresh();
setInterval(refresh, CONFIG.pollSec * 1000);
</script>
